<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TsvagaBot AI Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-300 flex flex-col h-[650px] relative">
    
    <!-- Dynamic Header -->
    <div class="bg-[#075e54] text-white p-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div id="avatar-initial" class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg">
          T
        </div>
        <div>
          <h2 id="header-user-title" class="font-bold text-sm leading-tight">TsvagaBot AI</h2>
          <p id="header-user-subtitle" class="text-xs text-emerald-200">Online • Meta Cloud API</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 text-sm">
        <button id="mic-btn" onclick="simulateVoiceNote()" title="Add Listing" class="hidden hover:opacity-80">
          <i class="fas fa-microphone bg-emerald-700 p-2 rounded-full"></i>
        </button>
        <button id="logout-btn" onclick="logoutUser()" title="Logout" class="hidden hover:opacity-80">
          <i class="fas fa-sign-out-alt text-xs bg-red-600 p-2 rounded-full"></i>
        </button>
      </div>
    </div>

    <!-- Location Indicator -->
    <div class="bg-[#128c7e] text-white text-xs px-3 py-1.5 flex justify-between items-center">
      <span>📍 Location: <b id="user-location-label">Not set</b></span>
      <button onclick="changeLocation()" class="underline opacity-80 hover:opacity-100">Change</button>
    </div>

    <!-- Chat Output Screen -->
    <div id="chat-window" class="flex-1 bg-[#efeae2] p-4 overflow-y-auto space-y-3"></div>

    <!-- Input Box -->
    <div class="bg-gray-100 p-2 border-t border-gray-200 flex items-center space-x-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type a message or search..." 
        onkeypress="if(event.key === 'Enter') sendSearch()"
        class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#075e54]"
      >
      <button 
        onclick="sendSearch()" 
        class="bg-[#075e54] text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-[#128c7e] transition-colors"
      >
        <i class="fas fa-paper-plane text-xs"></i>
      </button>
    </div>

  </div>

  <script>
    let currentUser = null;

    window.onload = function() {
      const savedUser = localStorage.getItem('tsvaga_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        updateHeaderUI();
        appendBotMsg(`👋 Welcome back, *${currentUser.name}*! Connected as *${currentUser.role}* in *${currentUser.location}*.\n\nType a search term or chat query below.`);
      } else {
        startOnboarding();
      }
    };

    function startOnboarding() {
      appendBotMsg("👋 *Welcome to TsvagaBot AI!* \n\nLet's get your profile set up.");
      
      setTimeout(() => {
        const name = prompt("Enter your name:");
        if (!name) return startOnboarding();

        const roleSelection = prompt("Register as:\n1. Buyer\n2. Seller", "1");
        const role = (roleSelection === "2" || roleSelection?.toLowerCase() === "seller") ? "Seller" : "Buyer";

        const location = prompt("Enter your city/area:", "Harare CBD");

        currentUser = { name, role, location: location || 'Harare CBD' };
        localStorage.setItem('tsvaga_user', JSON.stringify(currentUser));
        updateHeaderUI();

        appendBotMsg(`✅ *Profile Created!*\n\n• *Name:* ${currentUser.name}\n• *Role:* ${currentUser.role}\n• *Location:* ${currentUser.location}\n\nYou can now type your searches dynamically!`);
      }, 500);
    }

    function updateHeaderUI() {
      if (!currentUser) return;
      document.getElementById('header-user-title').innerText = currentUser.name;
      document.getElementById('header-user-subtitle').innerText = `${currentUser.role} • ${currentUser.location}`;
      document.getElementById('avatar-initial').innerText = currentUser.name.charAt(0).toUpperCase();
      document.getElementById('user-location-label').innerText = currentUser.location;
      document.getElementById('logout-btn').classList.remove('hidden');

      if (currentUser.role === 'Seller') {
        document.getElementById('mic-btn').classList.remove('hidden');
      } else {
        document.getElementById('mic-btn').classList.add('hidden');
      }
    }

    function logoutUser() {
      if (confirm("Logout of your account?")) {
        localStorage.removeItem('tsvaga_user');
        currentUser = null;
        document.getElementById('chat-window').innerHTML = '';
        document.getElementById('header-user-title').innerText = "TsvagaBot AI";
        document.getElementById('header-user-subtitle').innerText = "Online • Meta Cloud API";
        document.getElementById('avatar-initial').innerText = "T";
        document.getElementById('logout-btn').classList.add('hidden');
        document.getElementById('mic-btn').classList.add('hidden');
        startOnboarding();
      }
    }

    function changeLocation() {
      const newLoc = prompt("Enter new location:", currentUser ? currentUser.location : "Harare CBD");
      if (newLoc && currentUser) {
        currentUser.location = newLoc;
        localStorage.setItem('tsvaga_user', JSON.stringify(currentUser));
        updateHeaderUI();
        appendBotMsg(`📍 Location updated to *${newLoc}*.`);
      }
    }

    function appendUserMsg(text) {
      const chat = document.getElementById('chat-window');
      chat.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-[#dcf8c6] p-3 rounded-lg max-w-[85%] text-xs shadow-sm text-gray-800">
            ${text}
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    }

    function appendBotMsg(text) {
      const chat = document.getElementById('chat-window');
      const formattedText = text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      chat.innerHTML += `
        <div class="flex justify-start">
          <div class="bg-white p-3 rounded-lg max-w-[85%] text-xs shadow-sm text-gray-800">
            ${formattedText}
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendSearch() {
      const inputEl = document.getElementById('user-input');
      const query = inputEl.value.trim();
      if (!query) return;

      appendUserMsg(query);
      inputEl.value = '';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            query, 
            userLocation: currentUser ? currentUser.location : 'Harare CBD',
            userName: currentUser ? currentUser.name : 'User'
          })
        });

        const data = await res.json();
        appendBotMsg(data.reply);
      } catch (err) {
        appendBotMsg("❌ Failed to reach backend API.");
      }
    }

    async function simulateVoiceNote() {
      const userText = prompt("Enter listing details (Name and Price):");
      if (!userText || !userText.trim()) return;

      appendUserMsg(`🎤 <i>[Voice Note]</i><br>"${userText}"`);

      const priceMatch = userText.match(/\$(\d+)/) || userText.match(/(\d+)\s*(usd|dollars)/i);
      const price = priceMatch ? priceMatch[1] : '100';

      try {
        const res = await fetch('/api/add-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: userText.replace(/\$\d+/g, '').replace(/for \d+/g, '').trim(),
            price: price,
            location: currentUser ? currentUser.location : 'Harare CBD',
            stock: 'In Stock',
            category: userText.toLowerCase()
          })
        });

        const data = await res.json();
        if (data.success) {
          appendBotMsg(`🤖 *Published Listing:*\n\n📦 *Item:* ${data.product.name}\n💵 *Price:* $${data.product.price.toFixed(2)} USD\n📍 *Location:* ${data.product.location}`);
        }
      } catch (err) {
        appendBotMsg("❌ Error publishing listing.");
      }
    }
  </script>
</body>
</html>
