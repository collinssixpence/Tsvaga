<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TsvagaBot AI Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">

  <!-- WhatsApp Phone Container -->
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-300 flex flex-col h-[650px]">
    
    <!-- Header -->
    <div class="bg-[#075e54] text-white p-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg">
          T
        </div>
        <div>
          <h2 class="font-bold text-sm leading-tight">TsvagaBot AI</h2>
          <p class="text-xs text-emerald-200">Online • Meta Cloud API</p>
        </div>
      </div>
      <div class="flex space-x-3 text-sm">
        <button onclick="simulateVoiceNote()" title="Simulate Merchant Voice Note" class="hover:opacity-80">
          <i class="fas font-bold fa-microphone bg-emerald-700 p-2 rounded-full"></i>
        </button>
      </div>
    </div>

    <!-- Quick Location Bar -->
    <div class="bg-[#128c7e] text-white text-xs px-3 py-1.5 flex justify-between items-center">
      <span>📍 Location: <b>Harare CBD</b></span>
      <button onclick="appendBotMsg('📍 Location updated to Harare CBD/Eastgate.')" class="underline opacity-80 hover:opacity-100">Change</button>
    </div>

    <!-- Chat Messages Window -->
    <div id="chat-window" class="flex-1 bg-[#efeae2] p-4 overflow-y-auto space-y-3">
      
      <!-- Welcome Message -->
      <div class="flex justify-start">
        <div class="bg-white p-3 rounded-lg max-w-[85%] text-xs shadow-sm text-gray-800">
          👋 <b>Welcome to TsvagaBot AI!</b><br><br>
          Search for local product stock or ask any general inquiry.
        </div>
      </div>

    </div>

    <!-- Input Footer -->
    <div class="bg-gray-100 p-2 border-t border-gray-200 flex items-center space-x-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type or search..." 
        onkeypress="if(event.key === 'Enter') sendSearch()"
        class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#075e54]"
      >
      <button 
        onclick="sendSearch()" 
        class="bg-[#075e54] text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-[#128c7e] transition-colors"
      >
        <i class="fas fa-paper-plane text-xs"></i>
      </button>
    </div>

  </div>

  <script>
    // Append user message to chat UI
    function appendUserMsg(text) {
      const chat = document.getElementById('chat-window');
      chat.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-[#dcf8c6] p-3 rounded-lg max-w-[85%] text-xs shadow-sm text-gray-800">
            ${text}
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    }

    // Append bot message to chat UI
    function appendBotMsg(text) {
      const chat = document.getElementById('chat-window');
      // Format line breaks and bold syntax
      const formattedText = text.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<b>$1</b>');
      
      chat.innerHTML += `
        <div class="flex justify-start">
          <div class="bg-white p-3 rounded-lg max-w-[85%] text-xs shadow-sm text-gray-800">
            ${formattedText}
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    }

    // Handle input field search
    async function sendSearch() {
      const inputEl = document.getElementById('user-input');
      const query = inputEl.value.trim();
      if (!query) return;

      appendUserMsg(query);
      inputEl.value = '';

      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await res.json();
        appendBotMsg(data.reply);
      } catch (err) {
        appendBotMsg("❌ Could not reach TsvagaBot server. Please check your connection.");
      }
    }

    // Dynamic Voice Note / Merchant Add Product
    async function simulateVoiceNote() {
      const userText = prompt(
        "Simulate Voice Note / Quick Merchant Listing:", 
        "5 Samsung S20 phones for $220 each at Gulf Complex"
      );
      if (!userText || !userText.trim()) return;

      appendUserMsg(`🎤 <i>[Voice Note]</i><br>"${userText}"`);

      // Extract price from string if present
      const priceMatch = userText.match(/\$(\d+)/) || userText.match(/(\d+)\s*(usd|dollars)/i);
      const price = priceMatch ? priceMatch[1] : '100';

      try {
        const res = await fetch('/api/add-product', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: userText.split('for')[0].trim(),
            price: price,
            location: 'Harare CBD',
            stock: 'In Stock',
            category: userText.toLowerCase()
          })
        });

        const data = await res.json();
        if (data.success) {
          appendBotMsg(`🤖 *AI Parsed & Added to Live Database:*\n\n📦 *Listing:* ${data.product.name}\n💵 *Price:* $${data.product.price.toFixed(2)} USD\n📍 *Location:* ${data.product.location}\n\n✅ ${data.message}`);
        }
      } catch (err) {
        appendBotMsg("❌ Failed to register merchant listing.");
      }
    }
  </script>
</body>
</html>
